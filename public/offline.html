<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#001546" />
  <title>Offline · Sri Venkateswara University</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100svh; display: grid; place-items: center;
      padding: 24px; background: #001546; color: #FFE9C2;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center;
    }
    img { width: 88px; height: 88px; object-fit: contain; }
    h1 { margin: 20px 0 8px; font-family: Georgia, serif; font-size: 28px; color: #fff; }
    p { margin: 0 auto; max-width: 320px; line-height: 1.6; color: rgba(255, 233, 194, 0.75); }
    button {
      margin-top: 28px; min-height: 48px; padding: 0 28px; border: 0; border-radius: 999px;
      background: #FFB21A; color: #001546; font-weight: 700; font-size: 15px; cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="SVU crest" />
    <h1>You're offline</h1>
    <p>Check your internet connection. Pages you've already opened will still be available.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
